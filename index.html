<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Gaming Quiz App</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  </head>
  <body>
    <div class="quiz-container">
      <h1>Interactive Gaming Quiz App</h1>
      <button id="start-btn" onclick="startQuiz()">Start</button>
      <div id="quiz-box" class="hidden">
        <p id="question">Loading question...</p>
        <ul id="answers"></ul>
        <p id="timer">Time left: <span id="time">10</span> sec</p>
      </div>
      <div id="result-box" class="hidden">
        <h2>Quiz Completed!</h2>
        <p id="score"></p>
        <p>High Score: <span id="high-score">0</span></p>
        <button onclick="startQuiz()">Restart Quiz</button>
      </div>
      <audio id="correct-sound" src="sounds/correct.mp3"></audio>
      <audio id="incorrect-sound" src="sounds/incorrect.wav"></audio>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
